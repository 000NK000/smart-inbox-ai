version: '3.8'

services:
  mysql:
    profiles: [optional]
    image: mysql:8.0
    container_name: smart-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-development-only}
      MYSQL_DATABASE: smart_inbox
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: smart-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting}
    ports:
      - "6380:6379"
    restart: unless-stopped

  nacos:
    profiles: [optional]
    image: nacos/nacos-server:v2.2.3
    container_name: smart-nacos
    environment:
      - MODE=standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  rmqnamesrv:
    image: apache/rocketmq:5.1.0
    container_name: smart-rmqnamesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    restart: unless-stopped

  rmqbroker:
    image: apache/rocketmq:5.1.0
    container_name: smart-rmqbroker
    ports:
      # Keep the host and broker ports identical: clients use the advertised address.
      # Avoid the Windows reserved range that can include 10909-10912.
      - "127.0.0.1:30911:30911"
      - "127.0.0.1:30909:30909"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqbroker -n rmqnamesrv:9876 -c /etc/rocketmq/broker.conf
    volumes:
      - ./broker.conf:/etc/rocketmq/broker.conf
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      - rmqnamesrv
    restart: unless-stopped


  rmqdashboard:
    profiles: [optional]
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: smart-rmqdashboard
    ports:
      - "8081:8080"
    environment:
      - ROCKETMQ_CONFIG_NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    restart: unless-stopped

  prometheus:
    profiles: [optional]
    image: prom/prometheus:latest
    container_name: smart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    profiles: [optional]
    image: grafana/grafana:latest
    container_name: smart-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-local-development-only}
    depends_on:
      - prometheus
    restart: unless-stopped

  etcd:
    profiles: [optional]
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    profiles: [optional]
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped

  milvus:
    profiles: [optional]
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.4
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    restart: unless-stopped

# Queue messages and consumer offsets survive broker container recreation.
volumes:
  rocketmq-store:
